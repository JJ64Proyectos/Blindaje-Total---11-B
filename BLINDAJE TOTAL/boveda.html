<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IronVault - Mis Bóvedas</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000;
            background-image: url('assets/fondo-tecnologico.png');
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Barra Superior Horizontal */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 900;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-volver {
            font-size: 1.8rem;
            color: #3498db;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .btn-volver:hover {
            transform: scale(1.15);
            color: white;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: white;
            text-align: center;
            flex-grow: 1;
        }

        /* Contenedor Principal de Bóvedas */
        .main-container {
            padding: 120px 40px 40px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo del botón / tarjeta "Conectar caja con Bluetooth" */
        .card-conectar-bt {
            background: rgba(52, 152, 219, 0.15);
            border: 2px dashed #3498db;
            border-radius: 15px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
            text-align: center;
            padding: 15px;
            box-sizing: border-box;
        }

        .card-conectar-bt:hover {
            background: rgba(52, 152, 219, 0.3);
            border-style: solid;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .icono-bt {
            font-size: 2.5rem;
            color: #3498db;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .card-conectar-bt:hover .icono-bt {
            transform: scale(1.2);
            color: white;
        }

        .card-conectar-bt span {
            font-weight: bold;
            letter-spacing: 0.5px;
            font-size: 0.95rem;
        }

        /* Contenedor de dispositivos conectados */
        .boveda-item {
            background: rgba(10, 25, 47, 0.8);
            border: 2px solid #3498db;
            border-radius: 15px;
            height: 180px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .boveda-item h3 {
            margin: 0;
            color: #3498db;
            font-size: 1.1rem;
        }

        .boveda-info {
            font-size: 0.85rem;
            color: #aaa;
        }

        .status-conexion {
            color: #2ecc71;
            font-weight: bold;
        }

        /* === ESTILOS DEL SIDEBAR LATERAL === */
        .sidebar {
            position: fixed;
            top: 0; right: -300px;
            width: 280px; height: 100vh;
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            border-left: 2px solid #3498db;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
            transition: right 0.4s ease-in-out;
            z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px 20px; box-sizing: border-box; color: white;
        }
        .sidebar.activo { right: 0; }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(52, 152, 219, 0.3); padding-bottom: 15px;
        }
        .sidebar-header h3 { margin: 0; font-size: 1.2rem; color: #3498db; letter-spacing: 1px; }
        .btn-cerrar-sidebar { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .btn-cerrar-sidebar:hover { color: #3498db; }
        .sidebar-links { list-style: none; padding: 0; margin: 20px 0; flex-grow: 1; }
        .sidebar-links li { margin-bottom: 15px; }
        .sidebar-links a, .sidebar-links select {
            display: flex; align-items: center; gap: 12px; color: white; text-decoration: none;
            background: rgba(255, 255, 255, 0.05); padding: 12px 15px; border-radius: 8px;
            border: 1px solid rgba(52, 152, 219, 0.2); transition: 0.3s; font-size: 0.95rem; width: 100%; box-sizing: border-box;
        }
        .sidebar-links select { cursor: pointer; outline: none; }
        .sidebar-links select option { background: #0a192f; color: white; }
        .sidebar-links a:hover { background: rgba(52, 152, 219, 0.2); border-color: #3498db; transform: translateX(5px); }
        .sidebar-footer { border-top: 1px solid rgba(52, 152, 219, 0.3); padding-top: 15px; display: flex; flex-direction: column; gap: 12px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #3498db; object-fit: cover; }
        .user-details .user-name { font-weight: bold; font-size: 0.9rem; }
        .user-details .user-plan { font-size: 0.75rem; color: #3498db; }
        .btn-logout {
            background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: white;
            text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; display: block;
        }
        .btn-logout:hover { background: rgba(231, 76, 60, 0.5); }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <!-- Flecha para volver a IRONVAULT.html -->
            <a href="IRONVAULT.html" class="btn-volver" title="Volver">⬅</a>
        </div>
        <h1>Mis Bóvedas</h1>
        <!-- Gatillo para abrir el menú lateral -->
        <img src="assets/logo-IRONVAULT.png" id="btn-toggle-sidebar" style="width: 50px; cursor: pointer;" alt="Menú">
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container" id="gridBovedas">
        <!-- Tarjeta "Conectar caja con Bluetooth" -->
        <a href="#" class="card-conectar-bt" id="btnConectarBluetooth">
            <div class="icono-bt">📡</div>
            <span>Conectar caja con Bluetooth</span>
        </a>
    </div>

    <!-- SIDEBAR LATERAL -->
    <div id="sidebarMenu" class="sidebar">
        <div>
            <div class="sidebar-header">
                <h3>IRONVAULT MENU</h3>
                <button id="btnCerrarSidebar" class="btn-cerrar-sidebar">&times;</button>
            </div>
            <ul class="sidebar-links">
                <li><a href="Tienda.html">🛒 Tienda</a></li>
                <li><a href="empresa.html">🏢 Nuestra empresa</a></li>
                <li>
                    <select id="selectIdioma">
                        <option value="es">🌐 Idioma: Español</option>
                        <option value="en">🌐 Language: English</option>
                    </select>
                </li>
                <li><a href="#" id="btnBorrarBovedas">🗑️ Borrar Bóvedas</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <img src="assets/icon-config.png" alt="Avatar" class="user-avatar">
                <div class="user-details">
                    <div class="user-name">Usuario IronVault</div>
                    <div class="user-plan">Cuenta Segura</div>
                </div>
            </div>
            <a href="login.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD -->
    <script>
        // Control del Sidebar
        const btnToggle = document.getElementById('btn-toggle-sidebar');
        const sidebar = document.getElementById('sidebarMenu');
        const btnCerrar = document.getElementById('btnCerrarSidebar');

        btnToggle.addEventListener('click', () => sidebar.classList.add('activo'));
        btnCerrar.addEventListener('click', () => sidebar.classList.remove('activo'));

        // Control de Bóvedas y Bluetooth
        const btnConectarBluetooth = document.getElementById('btnConectarBluetooth');
        const gridBovedas = document.getElementById('gridBovedas');
        const btnBorrarBovedas = document.getElementById('btnBorrarBovedas');

        document.addEventListener('DOMContentLoaded', cargarBovedasDB);

        function cargarBovedasDB() {
            const bovedas = JSON.parse(localStorage.getItem('ironvault_bovedas')) || [];
            const tarjetaConectar = btnConectarBluetooth.outerHTML;
            gridBovedas.innerHTML = tarjetaConectar;
            
            // Reasignar evento al botón de conectar
            document.getElementById('btnConectarBluetooth').addEventListener('click', iniciarConexionBluetooth);

            bovedas.forEach(boveda => {
                renderizarBovedaHTML(boveda);
            });
        }

        function renderizarBovedaHTML(boveda) {
            const div = document.createElement('div');
            div.className = 'boveda-item';
            div.innerHTML = `
                <div>
                    <h3>🔐 ${boveda.nombre}</h3>
                    <p class="boveda-info">ID: ${boveda.id}</p>
                </div>
                <div class="boveda-info">
                    Estado: <span class="status-conexion">● Conectado (BT)</span>
                </div>
            `;
            gridBovedas.insertBefore(div, btnConectarBluetooth);
        }

        // Lógica de Conexión Bluetooth
        async function iniciarConexionBluetooth(e) {
            e.preventDefault();
            
            try {
                // Comprobación si el navegador soporta Bluetooth
                if (navigator.bluetooth) {
                    // Intento de abrir el explorador nativo de dispositivos Bluetooth del navegador/sistema
                    const dispositivo = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true
                    });

                    guardarNuevaBoveda(dispositivo.name || "Caja IronVault BT", dispositivo.id);
                } else {
                    // Simulación amigable si se prueba en entornos donde Web Bluetooth no esté activo
                    simularConexionBluetooth();
                }
            } catch (error) {
                console.log('Conexión Bluetooth cancelada o fallida: ', error);
            }
        }

        function simularConexionBluetooth() {
            const nombreSimulado = prompt("Introduce el nombre para identificar tu caja Bluetooth:", "Bóveda IronVault #1");
            if (nombreSimulado) {
                const idSimulado = 'BT-' + Math.floor(100000 + Math.random() * 900000);
                guardarNuevaBoveda(nombreSimulado, idSimulado);
            }
        }

        function guardarNuevaBoveda(nombre, id) {
            const nuevaBoveda = { nombre, id };
            let bovedas = JSON.parse(localStorage.getItem('ironvault_bovedas')) || [];
            bovedas.push(nuevaBoveda);
            localStorage.setItem('ironvault_bovedas', JSON.stringify(bovedas));
            cargarBovedasDB();
        }

        // Borrar dispositivos vinculados
        btnBorrarBovedas.addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('¿Deseas desvincular y borrar todas las bóvedas guardadas?')) {
                localStorage.removeItem('ironvault_bovedas');
                cargarBovedasDB();
            }
        });
    </script>
</body>
</html>
