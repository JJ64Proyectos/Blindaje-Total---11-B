<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IronVault - Mis Virtual Boxes</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%;
            background: #000;
            background-image: url('assets/fondo-tecnologico.png');
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow-x: hidden;
        }

        /* Barra Superior Horizontal */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 25, 47, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #3498db;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 900;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn-volver {
            font-size: 1.8rem;
            color: #3498db;
            text-decoration: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
        }

        .btn-volver:hover {
            transform: scale(1.15);
            color: white;
        }

        .top-bar h1 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: white;
            text-align: center;
            flex-grow: 1;
        }

        .logo-placeholder {
            width: 40px; /* Espacio simétrico a la derecha */
        }

        /* Contenedor Principal de Cajas */
        .main-container {
            padding: 120px 40px 40px 40px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Estilo del botón / tarjeta "Nueva Caja" */
        .card-nueva-caja {
            background: rgba(52, 152, 219, 0.15);
            border: 2px dashed #3498db;
            border-radius: 15px;
            height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            color: white;
        }

        .card-nueva-caja:hover {
            background: rgba(52, 152, 219, 0.3);
            border-style: solid;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
        }

        .icono-mas {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .card-nueva-caja:hover .icono-mas {
            transform: scale(1.2);
            color: white;
        }

        .card-nueva-caja span {
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Contenedor de cajas creadas dinamícamente */
        .caja-item {
            background: rgba(10, 25, 47, 0.8);
            border: 2px solid #3498db;
            border-radius: 15px;
            height: 180px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .caja-item h3 {
            margin: 0;
            color: #3498db;
            font-size: 1.1rem;
        }

        .caja-info {
            font-size: 0.85rem;
            color: #aaa;
        }

        /* === MODAL / VENTANA EMERGENTE PARA NUEVA CAJA === */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: rgba(10, 25, 47, 0.95);
            border: 2px solid #3498db;
            border-radius: 15px;
            width: 380px;
            padding: 30px;
            box-sizing: border-box;
            box-shadow: 0 0 30px rgba(52, 152, 219, 0.4);
        }

        .modal-content h2 {
            margin-top: 0;
            color: #3498db;
            text-align: center;
            font-size: 1.3rem;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(52, 152, 219, 0.4);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 0.95rem;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #3498db;
            background: rgba(52, 152, 219, 0.1);
        }

        .form-group select option {
            background: #0a192f;
            color: white;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-modal {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .btn-guardar {
            background: #3498db;
            color: white;
        }
        .btn-guardar:hover {
            background: #2980b9;
        }

        .btn-cancelar {
            background: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: white;
        }
        .btn-cancelar:hover {
            background: rgba(231, 76, 60, 0.5);
        }

        /* === ESTILOS DEL SIDEBAR LATERAL (HEREDADO) === */
        .sidebar {
            position: fixed;
            top: 0; right: -300px;
            width: 280px; height: 100vh;
            background: rgba(10, 25, 47, 0.95);
            backdrop-filter: blur(10px);
            border-left: 2px solid #3498db;
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.8);
            transition: right 0.4s ease-in-out;
            z-index: 1000;
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 25px 20px; box-sizing: border-box; color: white;
        }
        .sidebar.activo { right: 0; }
        .sidebar-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(52, 152, 219, 0.3); padding-bottom: 15px;
        }
        .sidebar-header h3 { margin: 0; font-size: 1.2rem; color: #3498db; letter-spacing: 1px; }
        .btn-cerrar-sidebar { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .btn-cerrar-sidebar:hover { color: #3498db; }
        .sidebar-links { list-style: none; padding: 0; margin: 20px 0; flex-grow: 1; }
        .sidebar-links li { margin-bottom: 15px; }
        .sidebar-links a, .sidebar-links select {
            display: flex; align-items: center; gap: 12px; color: white; text-decoration: none;
            background: rgba(255, 255, 255, 0.05); padding: 12px 15px; border-radius: 8px;
            border: 1px solid rgba(52, 152, 219, 0.2); transition: 0.3s; font-size: 0.95rem; width: 100%; box-sizing: border-box;
        }
        .sidebar-links select { cursor: pointer; outline: none; }
        .sidebar-links select option { background: #0a192f; color: white; }
        .sidebar-links a:hover { background: rgba(52, 152, 219, 0.2); border-color: #3498db; transform: translateX(5px); }
        .sidebar-footer { border-top: 1px solid rgba(52, 152, 219, 0.3); padding-top: 15px; display: flex; flex-direction: column; gap: 12px; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #3498db; object-fit: cover; }
        .user-details .user-name { font-weight: bold; font-size: 0.9rem; }
        .user-details .user-plan { font-size: 0.75rem; color: #3498db; }
        .btn-logout {
            background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: white;
            text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.9rem; display: block;
        }
        .btn-logout:hover { background: rgba(231, 76, 60, 0.5); }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <div class="top-bar">
        <div class="top-bar-left">
            <!-- Flecha para volver a IRONVAULT.html -->
            <a href="IRONVAULT.html" class="btn-volver" title="Volver">⬅</a>
        </div>
        <h1>Mis Virtual Boxes</h1>
        <!-- Botón o icono para abrir el menú lateral -->
        <img src="assets/logo-IRONVAULT.png" id="btn-toggle-sidebar" style="width: 50px; cursor: pointer;" alt="Menú">
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container" id="gridCajas">
        <!-- Cuadrado Redondeado con un más (Nueva Caja) -->
        <a href="#" class="card-nueva-caja" id="abrirModal">
            <div class="icono-mas">+</div>
            <span>Nueva Caja</span>
        </a>
    </div>

    <!-- VENTANA MODAL (CREAR NUEVA CAJA) -->
    <div class="modal-overlay" id="modalCaja">
        <div class="modal-content">
            <h2>Crear Nueva Caja Virtual</h2>
            <form id="formNuevaCaja">
                <div class="form-group">
                    <label>Nombre de la Caja:</label>
                    <input type="text" id="nombreCaja" required placeholder="Ej. Bóveda Personal">
                </div>
                <div class="form-group">
                    <label>Contraseña (Solo números):</label>
                    <!-- type="password" y patrón numérico -->
                    <input type="password" id="passCaja" required pattern="[0-9]+" inputmode="numeric" placeholder="Ej. 123456" title="Introduce solo números">
                </div>
                <div class="form-group">
                    <label>Tipo de Respaldo:</label>
                    <select id="respaldoCaja">
                        <option value="Escáner Facial">👤 Escáner Facial</option>
                        <option value="Huella Dactilar">👆 Huella Dactilar</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-modal btn-cancelar" id="cerrarModal">Cancelar</button>
                    <button type="submit" class="btn-modal btn-guardar">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SIDEBAR LATERAL -->
    <div id="sidebarMenu" class="sidebar">
        <div>
            <div class="sidebar-header">
                <h3>IRONVAULT MENU</h3>
                <button id="btnCerrarSidebar" class="btn-cerrar-sidebar">&times;</button>
            </div>
            <ul class="sidebar-links">
                <li><a href="Tienda.html">🛒 Tienda</a></li>
                <li><a href="empresa.html">🏢 Nuestra empresa</a></li>
                <li>
                    <select id="selectIdioma">
                        <option value="es">🌐 Idioma: Español</option>
                        <option value="en">🌐 Language: English</option>
                    </select>
                </li>
                <li><a href="#" id="btnBorrarCajas">🗑️ Borrar Cajas</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <img src="assets/icon-config.png" alt="Avatar" class="user-avatar">
                <div class="user-details">
                    <div class="user-name">Usuario IronVault</div>
                    <div class="user-plan">Cuenta Segura</div>
                </div>
            </div>
            <a href="login.html" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>

    <!-- SCRIPT DE FUNCIONALIDAD -->
    <script>
        // Control del Sidebar
        const btnToggle = document.getElementById('btn-toggle-sidebar');
        const sidebar = document.getElementById('sidebarMenu');
        const btnCerrar = document.getElementById('btnCerrarSidebar');

        btnToggle.addEventListener('click', () => sidebar.classList.add('activo'));
        btnCerrar.addEventListener('click', () => sidebar.classList.remove('activo'));

        // Control del Modal
        const abrirModal = document.getElementById('abrirModal');
        const cerrarModal = document.getElementById('cerrarModal');
        const modalCaja = document.getElementById('modalCaja');
        const formNuevaCaja = document.getElementById('formNuevaCaja');
        const gridCajas = document.getElementById('gridCajas');
        const btnBorrarCajas = document.getElementById('btnBorrarCajas');

        abrirModal.addEventListener('click', (e) => {
            e.preventDefault();
            modalCaja.style.display = 'flex';
        });

        cerrarModal.addEventListener('click', () => {
            modalCaja.style.display = 'none';
        });

        // Cargar cajas guardadas al iniciar (Simulación de Base de Datos local con localStorage)
        document.addEventListener('DOMContentLoaded', cargarCajasDB);

        function cargarCajasDB() {
            const cajas = JSON.parse(localStorage.getItem('ironvault_cajas')) || [];
            // Limpiar contenedor manteniendo el botón de "Nueva Caja"
            const tarjetaNueva = abrirModal.outerHTML;
            gridCajas.innerHTML = tarjetaNueva;
            
            // Volver a enganchar el evento al botón recién insertado
            document.getElementById('abrirModal').addEventListener('click', (e) => {
                e.preventDefault();
                modalCaja.style.display = 'flex';
            });

            cajas.forEach(caja => {
                renderizarCajaHTML(caja);
            });
        }

        function renderizarCajaHTML(caja) {
            const div = document.createElement('div');
            div.className = 'caja-item';
            div.innerHTML = `
                <div>
                    <h3>📦 ${caja.nombre}</h3>
                    <p class="caja-info">Seguridad: ****</p>
                </div>
                <div class="caja-info">
                    🛡️ Respaldo: <b>${caja.respaldo}</b>
                </div>
            `;
            // Insertar antes del botón de nueva caja
            gridCajas.insertBefore(div, abrirModal);
        }

        // Guardar nueva caja en base de datos
        formNuevaCaja.addEventListener('submit', (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreCaja').value;
            const password = document.getElementById('passCaja').value;
            const respaldo = document.getElementById('respaldoCaja').value;

            // Validación estricta solo números
            if (!/^\d+$/.test(password)) {
                alert('La contraseña debe contener únicamente números.');
                return;
            }

            const nuevaCaja = { nombre, password, respaldo };

            // Guardar en localStorage (Aquí puedes cambiarlo por un fetch() a tu Base de Datos SQL/NoSQL en el futuro)
            let cajas = JSON.parse(localStorage.getItem('ironvault_cajas')) || [];
            cajas.push(nuevaCaja);
            localStorage.setItem('ironvault_cajas', JSON.stringify(cajas));

            // Actualizar interfaz y cerrar modal
            cargarCajasDB();
            formNuevaCaja.reset();
            modalCaja.style.display = 'none';
        });

        // Funcionalidad para Borrar Cajas desde el menú lateral
        btnBorrarCajas.addEventListener('click', (e) => {
            e.preventDefault();
            if (confirm('¿Estás seguro de eliminar todas las cajas virtuales registradas?')) {
                localStorage.removeItem('ironvault_cajas');
                cargarCajasDB();
            }
        });
    </script>
</body>
</html>
